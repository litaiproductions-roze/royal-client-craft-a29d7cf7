<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- AI/Bot Blocking Meta Tags -->
    <meta name="robots" content="noai, noimageai" />
    <meta name="CCBot" content="nofollow" />
    <meta name="GPTBot" content="nofollow" />
    
    <!-- Basic SEO (per-route head managed by react-helmet-async) -->
    <title>LIT Productions — Premium Web Design</title>
    <meta name="description" content="LIT Productions creates premium custom websites that elevate your digital presence." />
    <meta name="author" content="LIT Productions" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LIT Productions" />
    <meta property="og:title" content="LIT Productions — Premium Web Design" />
    <meta property="og:description" content="LIT Productions creates premium custom websites that elevate your digital presence." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LIT Productions — Premium Web Design" />
    <meta name="twitter:description" content="LIT Productions creates premium custom websites that elevate your digital presence." />

    <!-- Privacy & Security -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"LIT Productions","url":"https://litaiproductions.lovable.app","description":"Premium custom web design and development studio."}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"LIT Productions","url":"https://litaiproductions.lovable.app"}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
