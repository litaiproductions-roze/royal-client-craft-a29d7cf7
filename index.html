<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="google-site-verification" content="VKP6RybJp9meGse-5xWeo3PWmNcP9tLnP8eEyauymfw" />
    
    <!-- Security Meta Tags -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- AI/Bot Blocking Meta Tags -->
    <meta name="robots" content="noai, noimageai" />
    <meta name="CCBot" content="nofollow" />
    <meta name="GPTBot" content="nofollow" />
    
    <!-- Basic SEO (per-route head managed by react-helmet-async) -->
    <title>Lit AI Productions — Long Island Web Design & AI Automation</title>
    <meta name="description" content="Lit AI Productions is a Long Island, NY web design and AI automation agency. Custom websites, AI tools, local SEO, and Cloudflare hosting for small businesses." />
    <meta name="author" content="Lit AI Productions" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lit AI Productions" />
    <meta property="og:title" content="Lit AI Productions — Long Island Web Design & AI Automation" />
    <meta property="og:description" content="Long Island web design and AI automation agency. Custom websites, AI tools, and local SEO for small businesses." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lit AI Productions — Long Island Web Design & AI Automation" />
    <meta name="twitter:description" content="Long Island web design and AI automation agency. Custom websites, AI tools, and local SEO for small businesses." />

    <!-- Privacy & Security -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"Organization","name":"Lit AI Productions","url":"https://litaiproductions.lovable.app","description":"Long Island web design and AI automation agency for small businesses, creators, and startups."}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"Lit AI Productions","url":"https://litaiproductions.lovable.app","potentialAction":{"@type":"SearchAction","target":"https://litaiproductions.lovable.app/?q={search_term_string}","query-input":"required name=search_term_string"}}
    </script>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"LocalBusiness","name":"Lit AI Productions","url":"https://litaiproductions.lovable.app","description":"Long Island, NY web design and AI automation agency.","address":{"@type":"PostalAddress","addressLocality":"Farmingdale","addressRegion":"NY","postalCode":"11735","addressCountry":"US"},"areaServed":["Long Island, NY","Farmingdale, NY","Suffolk County, NY","Nassau County, NY","New York"],"priceRange":"$$"}
    </script>
  </head>

    <div id="root"></div>
